[project]
name = "sandol-studyroom-service"
version = "0.1.0"
description = "스터디룸 및 열람실 현황 서비스"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20,<2",
    "asyncpg>=0.32,<1",
    "beautifulsoup4>=4.15,<5",
    "fastapi>=0.143,<1",
    "httpx>=0.28,<0.29",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "redis>=8.1,<9",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "respx>=0.23,<1",
    "ruff>=0.17,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
