<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>열람실 API 확인</title>
    <link rel="stylesheet" href="static/css/style.css">
    <script type="module" src="static/js/app.js"></script>
  </head>
  <body>
    <h1>열람실 API 확인</h1>
    <p class="note">개발용 화면이다. 각 영역은 아래 적힌 API 응답을 그대로 보여 준다.</p>

    <section>
      <h2>열람실 현황 <code>GET api/readingrooms</code></h2>
      <button id="rooms-refresh" type="button">새로고침</button>
      <span id="rooms-status" role="status"></span>
      <table>
        <thead><tr><th>코드</th><th>이름</th><th>전체</th><th>사용</th><th>여유</th><th>운영</th></tr></thead>
        <tbody id="rooms"></tbody>
      </table>
    </section>

    <section>
      <h2>열람실 상세 <code>GET api/readingrooms/{code}</code></h2>
      <p>위 표에서 행을 누르면 조회한다.</p>
      <span id="detail-status" role="status"></span>
      <div id="detail"></div>
      <div id="seat-grid" class="seat-grid"></div>
    </section>

    <section>
      <h2>좌석 조회 <code>GET api/readingrooms/{code}/seats/{number}</code></h2>
      <form id="seat-form">
        <select id="seat-room"><option>A1</option><option>A2</option><option>E1</option></select>
        <input id="seat-number" inputmode="numeric" maxlength="4" placeholder="좌석 번호" required>
        <button type="submit">조회</button>
      </form>
      <pre id="seat-result"></pre>
    </section>

    <section>
      <h2>서버 상태 <code>GET health</code></h2>
      <button id="health" type="button">확인</button>
      <span id="health-status" role="status"></span>
    </section>
  </body>
</html>
