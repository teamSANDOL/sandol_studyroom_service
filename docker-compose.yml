services:
  studyroom-service:
    image: sandol-sandol_studyroom_service:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      studyroom-db:
        condition: service_healthy
      studyroom-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/studyroom/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - studyroom-network
    logging: &logging
      driver: local
      options:
        max-size: "10m"
        max-file: "7"

  studyroom-db:
    image: postgres:15-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyroom_service}
      POSTGRES_USER: ${POSTGRES_USER:-studyroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: Asia/Seoul
    volumes:
      - studyroom-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - studyroom-network
    logging: *logging

  studyroom-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - studyroom-network
    logging: *logging

networks:
  studyroom-network:
    driver: bridge

volumes:
  studyroom-db-data:
