# CLI 용 설정이다. 앱은 시작할 때 app.core.database.run_migrations 로 같은 migration 을 적용한다.
# DB 주소는 .env 또는 환경 변수의 DATABASE_URL, POSTGRES_* 에서 읽는다.
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
